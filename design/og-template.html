<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>OG image template</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  /* Rendered to public/og-image.jpg by scripts/build-og.sh - not shipped as a page. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Rubik, sans-serif; color: #0b1f3a; }
  .card {
    width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column;
    justify-content: space-between; position: relative;
    background-color: #f8fbff;
    background-image:
      linear-gradient(#2563eb1a 1px, transparent 1px),
      linear-gradient(90deg, #2563eb1a 1px, transparent 1px),
      linear-gradient(#2563eb0d 1px, transparent 1px),
      linear-gradient(90deg, #2563eb0d 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .card::after { content: ''; position: absolute; inset-inline-start: 0; bottom: 0; width: 100%; height: 14px; background: #c2410c; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .tag { font-family: ui-monospace, monospace; font-size: 22px; color: #1d4ed8; direction: ltr; }
  h1 { font-size: 70px; font-weight: 800; line-height: 1.12; max-width: 19ch; }
  mark { background: linear-gradient(transparent 60%, #fdba7480 60%); color: inherit; }
  p.sub { font-size: 30px; color: #334155; margin-top: 20px; max-width: 34ch; }
  .bottom { display: flex; align-items: center; gap: 28px; font-size: 26px; color: #334155; }
  .pill { background: #0b1f3a; color: #fff; padding: 12px 26px; border-radius: 999px; font-weight: 500; }
  img.logo { height: 120px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="tag">// ECONOMIST SINCE 2007</div>
      <img class="logo" src="../public/brand/logo-horizontal.svg" alt="">
    </div>

    <div>
      <h1>המספרים של המשכנתא שלכם. <mark>בלי אותיות קטנות.</mark></h1>
      <p class="sub">ייעוץ משכנתאות, מחזור משכנתא ואיחוד הלוואות - בכל הארץ.</p>
    </div>

    <div class="bottom">
      <span class="pill">שיחת היכרות בלי התחייבות</span>
      <span>mashkantaotzion.co.il</span>
    </div>
  </div>
</body>
</html>
